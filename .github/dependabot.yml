# Dependabot Configuration
# Place in .github/dependabot.yml
#
# Dependabot automatically creates PRs for dependency updates,
# including security patches.

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

